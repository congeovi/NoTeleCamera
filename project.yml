name: NoTeleCamera
options:
  bundleIdPrefix: com.notelecamera
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "17.0"
targets:
  NoTeleCamera:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - "**/*.md"
          - "project.yml"
          - "Info.plist"
          - ".git/**"
          - ".github/**"
    settings:
      base:
        PRODUCT_NAME: NoTeleCamera
        PRODUCT_BUNDLE_IDENTIFIER: com.notelecamera.app
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist

