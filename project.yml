name: NoTeleCamera
options:
  bundleIdPrefix: com.notelecamera
  # Đây là `compatibilityVersion` của file .pbxproj, KHÔNG phải phiên bản Xcode
  # dùng để build. Xcode 26 đọc và build bình thường định dạng này; để nguyên
  # thì file project cũng mở được bằng Xcode cũ hơn. Cái quyết định SDK là
  # `deploymentTarget` bên dưới cộng với bản Xcode mà CI chọn.
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "26.0"
targets:
  NoTeleCamera:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: .
        excludes:
          - "**/*.md"
          - "project.yml"
          - "Info.plist"
          - ".git/**"
          - ".github/**"
          - "Tests/**"
    settings:
      base:
        PRODUCT_NAME: NoTeleCamera
        PRODUCT_BUNDLE_IDENTIFIER: com.notelecamera.app
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  NoTeleCameraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: NoTeleCamera
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

schemes:
  NoTeleCamera:
    build:
      targets:
        NoTeleCamera: all
    test:
      targets:
        - NoTeleCameraTests

