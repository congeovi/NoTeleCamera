name: Build and Package iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # Giao diện dùng Liquid Glass (API iOS 26) nên máy build phải có Xcode 26.
    # Image macos-26 mặc định là Xcode 26.6 (SDK iOS 26); macos-14 chỉ có tới
    # Xcode 16.2 (SDK iOS 18.2) và đang bị GitHub gỡ dần.
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Dò từ bản mới nhất xuống. Image macos-26 có Xcode 26.0.1 → 26.6,
          # macos-15 có tới 26.3, và bản Xcode 27 preview (nếu image có) cũng
          # dùng được — app chỉ cần SDK iOS 26 trở lên cho Liquid Glass.
          for candidate in \
            "Xcode_27_Release_Candidate" \
            "Xcode_26.6" \
            "Xcode_26.5" \
            "Xcode_26.4.1" \
            "Xcode_26.3" \
            "Xcode_26.2" \
            "Xcode_26.1.1" \
            "Xcode_26.0.1" \
          ; do
            if [ -d "/Applications/$candidate.app" ]; then
              sudo xcode-select -s "/Applications/$candidate.app"
              break
            fi
          done
          # Không khớp tên nào thì giữ Xcode mặc định của image (vẫn là 26.x);
          # in ra để log biết chính xác đang build bằng bản nào.
          xcodebuild -version
          xcodebuild -showsdks

      - name: Verify Xcode supports iOS 26 SDK
        run: |
          version=$(xcodebuild -version | head -n1 | awk '{print $2}')
          major=${version%%.*}
          echo "Xcode $version (major $major)"
          if [ "$major" -lt 26 ]; then
            echo "::error::Cần Xcode 26 trở lên để build Liquid Glass (API iOS 26)."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project NoTeleCamera.xcodeproj \
            -scheme NoTeleCamera \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/NoTeleCamera.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/NoTeleCamera.xcarchive/Products/Applications/NoTeleCamera.app Payload/
          zip -r NoTeleCamera.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoTeleCamera-IPA
          path: NoTeleCamera.ipa

